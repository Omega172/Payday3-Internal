name: Pre-Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version (e.g., v1.0.0b)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  build-prerelease:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.OMEGAWARE_REPOSITORIES_TOKEN || github.token }}
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
    - name: Build, test and package
      timeout-minutes: 60
      run: |
        foreach ($strMode in @("debug", "release")) {
          xmake f -p windows -m $strMode -a x64 --proxy=version -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $strFolder = if ($strMode -eq "debug") { "Debug" } else { "Release" }
          $strBuild = "Build/$strFolder/x64"
          & "$strBuild/OmegaWareTests/OmegaWareTests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $strPackage = "$strMode-package"
          New-Item -ItemType Directory -Force "$strPackage/Proxy" | Out-Null
          Copy-Item "$strBuild/OmegaWare/Payday3-Internal.dll" $strPackage
          Copy-Item "$strBuild/OmegaWareProxy/version.dll" "$strPackage/Proxy"
          if (Test-Path "$strBuild/OmegaWare/Payday3-Internal.pdb") { Copy-Item "$strBuild/OmegaWare/Payday3-Internal.pdb" $strPackage }
          if (Test-Path "$strBuild/OmegaWareProxy/version.pdb") { Copy-Item "$strBuild/OmegaWareProxy/version.pdb" "$strPackage/Proxy" }
          "Build completed on $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File "$strPackage/BUILD_INFO.txt"
        }
        Compress-Archive -Path debug-package\* -DestinationPath Payday3-Internal-Debug.zip
        Compress-Archive -Path release-package\* -DestinationPath Payday3-Internal-Release.zip
      shell: pwsh
    - name: Generate changelog
      id: changelog
      run: |
        $currentVersion = "${{ github.event.inputs.version }}"
        $allTags = git tag --sort=-creatordate
        if ($allTags -contains $currentVersion) {
          $idx = [array]::IndexOf($allTags, $currentVersion)
          $prevTag = if ($idx + 1 -lt $allTags.Length) { $allTags[$idx + 1] } else { $null }
        } else {
          $prevTag = $allTags | Select-Object -First 1
        }
        if ($prevTag) {
          $log = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)"
        } else {
          $log = git log --pretty=format:"- %s (%h)"
        }
        if (-not $log) { $log = "- No changes recorded." }
        $log = $log -join "`n"
        "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
        $log >> $env:GITHUB_OUTPUT
        "EOF" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: Create Pre-Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Pre-Release ${{ github.event.inputs.version }}
        draft: false
        prerelease: true
        files: |
          Payday3-Internal-Debug.zip
          Payday3-Internal-Release.zip
        body: |
          ## Payday3-Internal ${{ github.event.inputs.version }} (Pre-Release)
          ![GitHub Downloads (all assets, specific tag)](https://img.shields.io/github/downloads/Omega172/Payday3-Internal/${{ github.event.inputs.version }}/total)

          ⚠️ This is a pre-release build and may be unstable.

          ### Packages
          - **Payday3-Internal-Release.zip** - Release build (Payday3-Internal.dll + Proxy/version.dll)
          - **Payday3-Internal-Debug.zip** - Debug build (Payday3-Internal.dll + Proxy/version.dll + PDBs)

          ### Changes
          ${{ steps.changelog.outputs.CHANGELOG }}

          ### Installation
          1. Download `Payday3-Internal-Release.zip` (or `Payday3-Internal-Debug.zip`)
          2. Extract the archive
          3. Inject `Payday3-Internal.dll`, or copy `Proxy/version.dll` next to the game executable
          4. See README.md for details

          ### Build Information
          - Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
