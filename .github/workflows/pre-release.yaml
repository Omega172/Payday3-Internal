name: Pre-Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pre-release version (e.g., v1.0.0b)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  build-prerelease:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Fetch submodules recursively
        fetch-depth: 0  # Ensures a full clone (needed for some submodules)
    - name: Initialize and Update Submodules (if needed)
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        build-cache: true
    - name: Configure xmake (Debug)
      timeout-minutes: 15
      run: |
        xmake update
        xmake global --clean
        xmake config -m debug -a x64 -p windows -y
    - name: Build project (Debug)
      timeout-minutes: 20
      run: xmake build Payday-Internal-v2 Proxy
    - name: Package Debug artifacts (DLL + PDB)
      run: |
        mkdir debug-package
        xcopy /E /I Build\Debug\Payday-Internal-v2 debug-package\
        xcopy /E /I Build\Debug\Proxy debug-package\
        $internalDll = Get-ChildItem debug-package\Payday-Internal-v2.dll -ErrorAction SilentlyContinue
        $proxyDll = Get-ChildItem debug-package\version.dll -ErrorAction SilentlyContinue
        if (-not $internalDll) {
          Write-Error "Payday-Internal-v2.dll was not found in the debug build output."
          exit 1
        }
        if (-not $proxyDll) {
          Write-Error "version.dll was not found in the debug build output."
          exit 1
        }
        echo "Build completed on $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" > debug-package\BUILD_INFO.txt
      shell: pwsh
    - name: Configure xmake (Release)
      timeout-minutes: 15
      run: |
        xmake update
        xmake global --clean
        xmake config -m release -a x64 -p windows -y
    - name: Build project (Release)
      timeout-minutes: 20
      run: xmake build Payday-Internal-v2 Proxy
    - name: Package Release artifacts (DLL + PDB)
      run: |
        mkdir release-package
        xcopy /E /I Build\Release\Payday-Internal-v2 release-package\
        xcopy /E /I Build\Release\Proxy release-package\
        $internalDll = Get-ChildItem release-package\Payday-Internal-v2.dll -ErrorAction SilentlyContinue
        $proxyDll = Get-ChildItem release-package\version.dll -ErrorAction SilentlyContinue
        if (-not $internalDll) {
          Write-Error "Payday-Internal-v2.dll was not found in the release build output."
          exit 1
        }
        if (-not $proxyDll) {
          Write-Error "version.dll was not found in the release build output."
          exit 1
        }
        echo "Build completed on $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" > release-package\BUILD_INFO.txt
      shell: pwsh
    - name: Create ZIP archives
      run: |
        Compress-Archive -Path debug-package\* -DestinationPath Payday3-Internal-Debug.zip
        Compress-Archive -Path release-package\* -DestinationPath Payday3-Internal-Release.zip
      shell: pwsh
    - name: Generate changelog
      id: changelog
      run: |
        $currentVersion = "${{ github.event.inputs.version }}"
        $allTags = git tag --sort=-creatordate
        if ($allTags -contains $currentVersion) {
          $idx = [array]::IndexOf($allTags, $currentVersion)
          $prevTag = if ($idx + 1 -lt $allTags.Length) { $allTags[$idx + 1] } else { $null }
        } else {
          $prevTag = $allTags | Select-Object -First 1
        }
        if ($prevTag) {
          $log = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)"
        } else {
          $log = git log --pretty=format:"- %s (%h)"
        }
        if (-not $log) { $log = "- No changes recorded." }
        $log = $log -join "`n"
        "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
        $log >> $env:GITHUB_OUTPUT
        "EOF" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: Create Pre-Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Pre-Release ${{ github.event.inputs.version }}
        draft: false
        prerelease: true
        files: |
          Payday3-Internal-Debug.zip
          Payday3-Internal-Release.zip
        body: |
          ## Payday3-Internal ${{ github.event.inputs.version }} (Pre-Release)
          ![GitHub Downloads (all assets, specific tag)](https://img.shields.io/github/downloads/Omega172/Payday3-Internal/${{ github.event.inputs.version }}/total)
          
          ⚠️ This is a pre-release build and may be unstable.
          
          ### Packages
          - **Payday3-Internal-Release.zip** - Release build (Payday-Internal-v2.dll + Proxy version.dll + PDBs)
          - **Payday3-Internal-Debug.zip** - Debug build (Payday-Internal-v2.dll + Proxy version.dll + PDBs)
          
          ### Changes
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ### Installation
          1. Download `Payday3-Internal-Release.zip` (or `Payday3-Internal-Debug.zip`)
          2. Extract the archive
          3. Follow the instructions in README.md
          
          ### Build Information
          - Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
