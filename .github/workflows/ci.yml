name: CI
on:
  push:
    branches: [ v2, v3, v3-ms-store ]
  pull_request:
    branches: [ v2, v3, v3-ms-store ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [debug, release]
    env:
      BUILD_DIR: Build/${{ matrix.build_configuration == 'debug' && 'Debug' || 'Release' }}/x64
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.OMEGAWARE_REPOSITORIES_TOKEN || github.token }}
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
    - name: Configure xmake
      timeout-minutes: 15
      run: xmake f -p windows -m ${{ matrix.build_configuration }} -a x64 --proxy=version -y
    - name: Build project
      timeout-minutes: 30
      run: xmake build
    - name: Run framework tests
      run: |
        & "$env:BUILD_DIR/OmegaWareTests/OmegaWareTests.exe"
        exit $LASTEXITCODE
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: payday3-internal-${{ matrix.build_configuration }}
        path: |
          ${{ env.BUILD_DIR }}/OmegaWare/Payday3-Internal.dll
          ${{ env.BUILD_DIR }}/OmegaWare/Payday3-Internal.pdb
          ${{ env.BUILD_DIR }}/OmegaWareProxy/version.dll
          ${{ env.BUILD_DIR }}/OmegaWareProxy/version.pdb
        if-no-files-found: error
        retention-days: 7
