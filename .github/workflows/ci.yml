name: CI
on:
  push:
    branches: [ v2, v3 ]
  pull_request:
    branches: [ v2, v3 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [debug, release]
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        path: src
        submodules: recursive
        token: ${{ secrets.OMEGAWARE_REPOSITORIES_TOKEN || github.token }}
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
    - name: Build, test and package
      timeout-minutes: 75
      shell: pwsh
      run: |
        & ./src/Scripts/BuildPackage.ps1 -Modes ${{ matrix.build_configuration }} -Out packages
        exit $LASTEXITCODE
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: payday3-internal-${{ matrix.build_configuration }}
        path: packages/${{ matrix.build_configuration }}
        if-no-files-found: error
        retention-days: 7
