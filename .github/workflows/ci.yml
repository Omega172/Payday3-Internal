name: CI
on:
  push:
    branches: [ v2, v3 ]
  pull_request:
    branches: [ v2, v3 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [debug, release]
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v6
      with:
        path: src
        submodules: recursive
        token: ${{ secrets.OMEGAWARE_REPOSITORIES_TOKEN || github.token }}
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
        package-cache: true
        package-cache-key: packages-${{ matrix.build_configuration }}
        project-path: src
    - name: Read the runner image version
      id: image
      shell: pwsh
      run: |
        "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
    - name: Restore compiled objects
      id: objects
      uses: actions/cache@v5
      with:
        path: |
          src/Build/.objs
          src/Build/.deps
          src/Build/.gens
          src/Build/Config
          src/Build/SourceManifest.txt
        key: objects-${{ matrix.build_configuration }}-${{ steps.image.outputs.version }}-${{ hashFiles('src/Scripts/RestoreObjectTimes.ps1', 'src/Source/Third-Party/Dumper-7/CppSDK/SDK/Basic.hpp', 'src/Source/Third-Party/Dumper-7/CppSDK/SDK/Engine_classes.hpp', 'src/Source/Third-Party/Dumper-7/CppSDK/SDK/Starbreeze_classes.hpp') }}-${{ github.sha }}
        restore-keys: |
          objects-${{ matrix.build_configuration }}-${{ steps.image.outputs.version }}-${{ hashFiles('src/Scripts/RestoreObjectTimes.ps1', 'src/Source/Third-Party/Dumper-7/CppSDK/SDK/Basic.hpp', 'src/Source/Third-Party/Dumper-7/CppSDK/SDK/Engine_classes.hpp', 'src/Source/Third-Party/Dumper-7/CppSDK/SDK/Starbreeze_classes.hpp') }}-
    - name: Restore source times for the cached objects
      shell: pwsh
      run: ./src/Scripts/RestoreObjectTimes.ps1 -Action Restore
    - name: Build, test and package
      timeout-minutes: 75
      shell: pwsh
      env:
        OMEGAWARE_DIAGNOSE_BUILD: '1'
      run: |
        & ./src/Scripts/BuildPackage.ps1 -Modes ${{ matrix.build_configuration }} -Out packages
        if ($LASTEXITCODE -ne 0 -and '${{ steps.objects.outputs.cache-matched-key }}' -ne '') {
          Write-Host "the build failed with cached objects, retrying from scratch"
          Remove-Item -Recurse -Force src/Build/.objs, src/Build/.deps, src/Build/.gens, src/Build/Config, src/Build/SourceManifest.txt -ErrorAction SilentlyContinue
          & ./src/Scripts/RestoreObjectTimes.ps1 -Action Restore
          & ./src/Scripts/BuildPackage.ps1 -Modes ${{ matrix.build_configuration }} -Out packages
        }
        exit $LASTEXITCODE
    - name: Record the source hashes for the next run
      shell: pwsh
      run: ./src/Scripts/RestoreObjectTimes.ps1 -Action Save
    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: payday3-internal-${{ matrix.build_configuration }}
        path: packages/${{ matrix.build_configuration }}
        if-no-files-found: error
        retention-days: 7
