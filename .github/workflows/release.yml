name: Release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        path: src
        submodules: recursive
        fetch-depth: 0
        token: ${{ secrets.OMEGAWARE_REPOSITORIES_TOKEN || github.token }}
    - name: Checkout Steam SDK (v3)
      uses: actions/checkout@v4
      with:
        ref: v3
        path: sdk-steam
        sparse-checkout: Source/Third-Party/Dumper-7
    - name: Checkout Microsoft Store SDK (v3-ms-store)
      uses: actions/checkout@v4
      with:
        ref: v3-ms-store
        path: sdk-wingdk
        sparse-checkout: Source/Third-Party/Dumper-7
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
    - name: Build, test and package Steam and WinGDK
      timeout-minutes: 130
      shell: pwsh
      run: |
        & ./src/Scripts/BuildStores.ps1 -Modes debug,release -SteamSdk sdk-steam/Source/Third-Party/Dumper-7/CppSDK -WinGdkSdk sdk-wingdk/Source/Third-Party/Dumper-7/CppSDK -Out packages
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Compress-Archive -Path packages/debug/* -DestinationPath Payday3-Internal-Debug.zip
        Compress-Archive -Path packages/release/* -DestinationPath Payday3-Internal-Release.zip
    - name: Get version
      id: get_version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}"
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: Generate changelog
      id: changelog
      working-directory: src
      run: |
        $currentVersion = "${{ steps.get_version.outputs.VERSION }}"
        $allTags = git tag --sort=-creatordate
        if ($allTags -contains $currentVersion) {
          $idx = [array]::IndexOf($allTags, $currentVersion)
          $prevTag = if ($idx + 1 -lt $allTags.Length) { $allTags[$idx + 1] } else { $null }
        } else {
          $prevTag = $allTags | Select-Object -First 1
        }
        if ($prevTag) {
          $log = git log "$prevTag..HEAD" --pretty=format:"- %s (%h)"
        } else {
          $log = git log --pretty=format:"- %s (%h)"
        }
        if (-not $log) { $log = "- No changes recorded." }
        $log = $log -join "`n"
        "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
        $log >> $env:GITHUB_OUTPUT
        "EOF" >> $env:GITHUB_OUTPUT
      shell: pwsh
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: |
          Payday3-Internal-Debug.zip
          Payday3-Internal-Release.zip
        body: |
          ## Payday3-Internal ${{ steps.get_version.outputs.VERSION }}
          ![GitHub Downloads (all assets, specific tag)](https://img.shields.io/github/downloads/Omega172/Payday3-Internal/${{ steps.get_version.outputs.VERSION }}/total)

          ### Packages
          Each zip has a `Steam` and a `WinGDK` (Microsoft Store) folder; use the one matching your copy of the game.
          - **Payday3-Internal-Release.zip** - Release builds (`Steam/Payday3-Internal.dll`, `WinGDK/Payday3-Internal-WinGDK.dll`, each with `Proxy/version.dll`)
          - **Payday3-Internal-Debug.zip** - Debug builds of the same, with PDBs

          ### Changes
          ${{ steps.changelog.outputs.CHANGELOG }}

          ### Installation
          1. Download `Payday3-Internal-Release.zip` (or `Payday3-Internal-Debug.zip`)
          2. Extract the archive and open the folder for your store (`Steam` or `WinGDK`)
          3. Inject the DLL in it, or copy its `Proxy/version.dll` next to the game executable
          4. See README.md for details

          ### Build Information
          - Build Date: ${{ github.event.head_commit.timestamp }}
          - Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
